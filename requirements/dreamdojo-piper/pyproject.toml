[project]
name = "rlinf-dreamdojo-piper-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    # DreamDojo / Cosmos-Predict2 CUDA 12.8, Torch 2.7 runtime.
    "cosmos-predict2[cu128]",

    # kai0/OpenPI is imported from KAI0_REPO_PATH by the launcher. List its
    # compatible runtime dependencies here instead of installing the package:
    # upstream metadata requires Python 3.11 and Torch 2.7.1, while NVIDIA's
    # Cosmos CUDA wheels are CPython 3.10 and Torch 2.7.0 only.
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "chex==0.1.90",
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "gym-aloha>=0.1.1",
    "imageio>=2.36.1",
    # OpenPI uses JAX only for config/tokenizer helpers in this PyTorch VLA
    # runtime. Keep it on CPU so it cannot compete with Cosmos for CUDA libs.
    "jax==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot",
    "lightning==2.6.5",
    "lightning-utilities==0.15.3",
    "ml-collections==1.0.0",
    "msgpack>=1.0.5",
    "numpydantic>=1.6.6",
    "opencv-python>=4.10.0.84",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "piq==0.8.0",
    "polars>=1.30.0",
    "pytorch3d",
    "pytorch-lightning==2.6.5",
    "rich>=14.0.0",
    "sentencepiece>=0.2.0",
    "tensorstore==0.1.74",
    "tqdm-loggable>=0.2",
    "treescope>=0.1.7",
    "tyro>=0.9.5",
    "wandb>=0.19.1,<0.25.1",
    "websockets>=11.0",

    # RLinf embodied runtime (avoid its root Torch 2.6 override and the
    # torchdata/liger packages that constrain Torch below 2.7).
    "debugpy",
    "gym",
    "gymnasium",
    "h5py",
    "icmplib",
    "ninja",
    "nvitop",
    "pybind11",
    "ray[default]>=2.47.0",
    "sortedcontainers",
    "swanlab>=0.6.11",
    "tensorboard",
    "timm",
    "torchcodec==0.5.0",
    "torchmetrics==1.9.0",
]

[tool.uv.sources]
cosmos-predict2 = { git = "https://github.com/Shirk6/DreamDojo.git", rev = "27aa97b864fbb2638e537ba299520c45a3035003" }
lerobot = { git = "https://github.com/huggingface/lerobot.git", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", tag = "v0.7.9" }

[tool.uv]
# kai0's PyTorch implementation and transformer overlay target this version.
# It is compatible with Cosmos in the validated unified runtime despite
# Cosmos-Predict2's older exact metadata pin.
override-dependencies = [
    "transformers==4.53.2",
]

[tool.uv.extra-build-dependencies]
pytorch3d = [
    { requirement = "torch", match-runtime = true },
    "setuptools",
    "wheel",
    "ninja",
]

[tool.uv.extra-build-variables]
# DreamDojo only imports pytorch3d.transforms for rotation conversion. Skip the
# renderer/ops extension so one plain uv sync does not need a local CUDA toolkit
# or compile GPU-specific kernels on the login node.
pytorch3d = { PYTORCH3D_NO_EXTENSION = "1" }
