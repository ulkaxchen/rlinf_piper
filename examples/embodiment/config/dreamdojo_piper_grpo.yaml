defaults:
  - env/dreamdojo_piper@env.train
  - env/dreamdojo_piper@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

# NOTE: This config wires the DreamDojo piper world model into RLinf's embodied
# GRPO loop, with pi0.5 as the policy. For *rollout* the algorithm choice does
# not matter (PPO vs GRPO only differs in the gradient step). Reward is a zero
# stub until the piper reward model lands, so any real training is meaningless
# regardless of algorithm.
#
# Notes:
# - Policy: the openpi dataconfig "pi05_piper" (rlinf/models/embodiment/openpi/
#   dataconfig/) matches piper's obs/action spec. It emits *absolute* 14-dim
#   joint actions (use_delta_joint_actions=False) padded to the model's internal
#   action_dim=32; the env min-max normalizes and diffs them into DreamDojo's
#   training space (see env.action_norm_* keys). The SFT'd pi0.5 (run2/iter30000)
#   used action_horizon=50; norm_stats live in assets/norm_stats.json.
# - If switching to PPO actor-critic later: set add_value_head=True and flip
#   algorithm.loss_type=actor_critic + algorithm.adv_type=gae.

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

weight_syncer:
  patch:
    transport_device: cpu

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "dreamdojo_piper_grpo"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 100

  resume_dir: null
  ckpt_path: null
  per_worker_log: True

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 2

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1

  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  reward_coef: 5.0

  filter_rewards: False
  rewards_lower_bound: 0.5
  rewards_upper_bound: 4.5

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 16
    group_size: ${algorithm.group_size}
    max_episode_steps: 720
    max_steps_per_rollout_epoch: 720
    reward_coef: ${algorithm.reward_coef}
    enable_offload: True       # otherwise, may OOM at 1440x640
    success_reward_threshold: 0.9
    num_inference_steps: 35     
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 720
    max_steps_per_rollout_epoch: 720
    group_size: 1
    is_eval: True
    success_reward_threshold: 0.9
    num_inference_steps: 5
    video_cfg:
      save_video: True
      fps: 10
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0

  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1

  model:
    # huggingface.co/Shirk6/pi05-piper-insert-mouse-battery-run2-30000-pytorch
    model_path: "/project/peilab/srk/wmpo_workspace/kai0/checkpoints/pi05_piper_insert_mouse_battery_normal/piper_insert_mouse_battery_run2/30000_pytorch"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 20
  global_batch_size: 160
  seed: 1234
  enable_offload: True

  model:
    model_path: "/project/peilab/srk/wmpo_workspace/kai0/checkpoints/pi05_piper_insert_mouse_battery_normal/piper_insert_mouse_battery_run2/30000_pytorch"
    model_type: "openpi"
    num_action_chunks: 36
    action_dim: 14
    add_value_head: False   # GRPO does not use a critic head
    openpi:
      config_name: "pi05_piper"   # emits absolute 14-dim joint actions (padded to 32)
      num_images_in_input: 3      # env splits the 1440x640 stack into top_head + 2 wrist views
      noise_level: 0.5
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False  # openpi does NOT support gradient checkpointing
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
