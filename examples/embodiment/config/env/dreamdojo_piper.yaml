env_type: dreamdojo_wm
task_suite_name: piper_insert_mouse_battery
wm_env_type: piper

total_num_envs: null

auto_reset: False
ignore_terminations: False
# 30Hz policy-action units (= num_action_chunks per chunk_step). 720 / 36 = 20
# chunk steps per rollout epoch; truncation lands on a chunk boundary.
max_steps_per_rollout_epoch: 720
max_episode_steps: 720 # max episode steps for truncation

use_rel_reward: False   # reward model is a stub (zeros) for now
reward_coef: 1.0

is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: False
specific_reset_id: null

video_cfg:
  save_video: True
  info_on_video: True
  fps: 10
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

###  ------------------ DreamDojo (Cosmos-Predict2) params ------------------

# Path to the DreamDojo repo (added to sys.path so `cosmos_predict2` imports).
dreamdojo_repo_path: /project/peilab/srk/wmpo_workspace/DreamDojo

# Teacher backend. Match the DreamDojo reference Piper autoregressive command,
# which uses the converted EMA BF16 checkpoint.
dreamdojo_backend: autoreg
dreamdojo_ckpt_path: /project/peilab/srk/wmpo_workspace/DreamDojo/dreamdojo_logs/dreamdojo/exp1201/piper_vertical_1440_640_fps10/checkpoints/iter_000030000/model_ema_bf16.pt
experiment: dreamdojo_2b_1440_640_piper
config_file: cosmos_predict2/_src/predict2/action/configs/action_conditioned/config.py

enable_kir: False

# Reset initial frames: npy trajectories (export with scripts/convert_piper_to_initial_npy.py).
initial_image_path: /project/peilab/srk/wmpo_workspace/piper_data/insert-mouse-battery/piper_initial_frames

chunk: 36                       # = num_action_chunks (30Hz policy-action steps)
action_stride: 3                # subsample 30Hz actions -> 10fps before generation
num_inference_steps: 35         # diffusion steps; lower for faster (smoke) rollout
guidance: 0
height: 1440                    # native generation height
width: 640                      # native generation width
num_latent_conditional_frames: 1
image_size: [480, 640]          # per-view image resolution returned to the policy
num_camera_views: 3

# Action layout inside the 384-wide cosmos action vector (piper -> [169:183]).
model_action_dim: 384
action_slot: [169, 183]
# pi05_piper emits absolute 14-dim joint actions. DreamDojo piper was trained
# with grouped deltas over the *min-max-normalized* absolute joints:
#   norm = 2*(a-min)/(max-min)-1;  delta = norm[t:t+4] - norm[t-1].
# So we min-max normalize the policy's absolute actions with the SAME dataset
# stats used at training time (groot_configs.py min_max transform), then diff.
policy_action_format: absolute  # absolute | delta
action_delta_window: 4
# LeRobot meta/stats.json whose "action" entry holds the 14-dim joint min/max
# (order: left_arm_joint_position[7], right_arm_joint_position[7]).
action_norm_mode: min_max       # min_max | none
action_norm_key: action
action_norm_stats_path: /project/peilab/srk/wmpo_workspace/piper_data/insert-mouse-battery/piper_insert_mouse_battery_lerobot/meta/stats.json

reward_model:
  type: resnet
  model_path: /project/peilab/srk/wmpo_workspace/piper_data/insert-mouse-battery/reward_model/full_weights.pt              # path to piper ResNet reward ckpt (.pt/.safetensors)
  arch: resnet18
  pretrained: False
  hidden_dim: null
  dropout: 0
  image_size: [3, 1440, 640]    # native CHW; matches height/width above (no resize)
  normalize: true
  precision: fp32
  reward_threshold: null
